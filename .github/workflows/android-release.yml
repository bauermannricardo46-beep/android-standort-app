name: Android APK Release

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Validate project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/build.gradle.kts

      - name: Build and test with Gradle
        run: |
          gradle --no-daemon test assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouteLab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release from main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          name: RouteLab GPS Simulator v1.0.0
          body: |
            Android debug APK for the RouteLab GPS Simulator.
            
            This build is intended for development and mock-location testing. Android identifies simulated locations, and individual apps may reject them.
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true

      - name: Publish GitHub Release for pushed version tag
        if: startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/tags/v1.0.0'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
